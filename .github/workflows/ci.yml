name: CI

on:
  pull_request:
  push:
    branches: [main]
  # "Run workflow" on main runs everything again, the hosted migrations included.
  workflow_dispatch:

env:
  # The local stack's images from GitHub's registry, not public.ecr.aws: with
  # several jobs pulling at once, ECR's anonymous per-IP limit refused a shard
  # ("Data limit exceeded").
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # Split six ways: a private repo's runner has 2 cores, so Playwright runs one
  # test at a time there (33 minutes of tests in one job), and many specs play
  # in real time (count-ins, loop passes, a minute of practice). Each shard
  # starts its own Supabase. It doesn't wait for `check`, which would only add
  # its three minutes to the wall clock.
  e2e:
    name: e2e (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      # One failing shard shouldn't hide what the others find.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Signed-in specs need Auth and REST; Mailpit catches the sign-in emails the login form sends.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor
      - run: npm run e2e -- --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  db:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only Postgres, Auth, REST, Storage and the gateway are needed for the tests.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,mailpit
      - run: npm run test:db
      - name: Generated types match the migrations
        run: npm run db:types && git diff --exit-code src/lib/database.types.ts
      - run: npm run db:seed

  # Applies new migrations to the hosted Supabase project once they reach main,
  # so nobody runs `supabase db push` by hand. It doesn't wait for the other
  # jobs: they already passed on the PR, and Workers Builds deploys main's build
  # at the same moment, so the schema should land first. Migrations must
  # therefore be additive (old builds keep working on the new schema).
  migrate:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One push at a time, never cancelled half way.
    concurrency:
      group: hosted-migrations
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_REF: pdvrzgeoijerdzioxtse
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets (docs/release.md, section 2)."
            exit 1
          fi
      # CLI 3 aims every command at the local stack unless told --remote (the linked project).
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migrations to apply
        run: npx supabase db push --remote --dry-run
      # --yes: hosted changes ask for confirmation, which CI cannot give. A migration
      # that fails (a check an existing row breaks) rolls back and stops here.
      - run: npx supabase db push --remote --yes
      # Hosted types carry a `__InternalSupabase` header (the server's PostgREST
      # version) that the local stack's don't; it says nothing about the schema.
      - name: Hosted schema matches the committed types
        run: |
          npx supabase gen types typescript --remote --schema public \
            | npx prettier --stdin-filepath database.types.ts \
            | sed '/Allows to automatically instantiate createClient/,/^  };$/d' \
            | diff - src/lib/database.types.ts
